{% extends "base.html" %}

{% block title %}Ro'yxatdan o'tish{% endblock %}

{% block content %}
<div class="card">
    <h2>Ro'yxatdan o'tish</h2>

    {% if user.is_authenticated %}
        <p>Siz <b>{{ user.username }}</b> sifatida tizimdasiz.</p>
    {% else %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Ro'yxatdan o'tish</button>
        </form>
    {% endif %}
</div>
{% endblock %}
